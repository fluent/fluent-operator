{{- if .Values.Kubernetes }}
{{- if .Values.fluentd.enable }}
{{- if .Values.fluentd.output.opensearch.enable }}
{{- with .Values.fluentd.output.opensearch }}
apiVersion: fluentd.fluent.io/v1alpha1
kind: ClusterOutput
metadata:
  name: fluentd-output-opensearch
  labels:
    output.fluentd.fluent.io/enabled: "true"
spec:
  outputs:
    - opensearch:
        host: {{ .host | quote }}
        port: {{ .port }}
        scheme: {{ .scheme | quote }}
        logstashFormat: {{ dig "logstashFormat" true . }}
        logstashPrefix: {{ .logstashPrefix | quote }}
      {{- if and .buffer .buffer.enable }}
      {{- with .buffer }}
      buffer:
        type: {{ .type | quote }}
        path: {{ .path | quote }}
      {{- end }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
